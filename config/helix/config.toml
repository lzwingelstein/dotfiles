theme = "dracula"

[editor]
line-number = "relative"
cursorline = true
mouse = true
true-color = true
rulers = [120]


[keys.normal]
C-g = ":sh tmux popup -d \"#{pane_current_path}\" -xC -yC -w80% -h80% -E lazygit"

[keys.normal.space]
f = "file_picker"
F = "file_picker_in_current_directory"
g = ":sh tmux display-popup -S 50% -e HELIX=1 -e HELIX_RUNTIME=~/.local/share/helix/runtime -e HELIX_CONFIG_FILE=$HELIX_CONFIG_FILE -w 90% lazygit"
