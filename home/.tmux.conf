set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins'

set-option -a terminal-features 'foot:RGB'
# OPTS
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 50000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
# Options to make tmux more pleasant
# set -g default-terminal "tmux-256color"

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
#set -g @catppuccin_window_status_style "rounded"
#set -g @catppuccin_window_text "#W"

# Status bar épuré
set -g status-style "bg=colour235,fg=colour252"

# KEYS
setw -g status-keys vi
setw -g mode-keys vi
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind C new-window -c "#{pane_current_path}" # new window in current path, not session path
bind G display-popup -w 80% -h 80% -E "lazygit"
bind Y display-popup -w 65% -h 60% -E "yazi"
bind t display-popup -w 65% -h 60% -E "zsh"
# Set default directory for new windows in this session to current directory:
bind M-c attach-session -c "#{pane_current_path}"

bind r source-file ~/.tmux.conf \; display "Config rechargée"
bind ? list-keys
bind m run-shell 'tmux display-popup -E -w 60 -h 25 less ~/.tmux-cheatsheet.sh'
bind -T prefix e run-shell 'tmux display-popup -E -w 80% -h 80% vi ~/.tmux.conf'

# NAVIGATION BETWEEN PANES
 is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'catppuccin/tmux#v2.3.0'

set -g @prefix_highlight_show_copy_mode 'on'

# Load catppuccin
run ~/.tmux/plugins/tmux/catppuccin.tmux

## Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
